[package]
name = "texttop"
version = "0.2.0"
edition = "2021"
description = "A colorful text-based desktop environment for your terminal"

[features]
default = ["audio", "web-engine", "apphost"]
# Audio playback (rodio). On Linux needs ALSA headers at build time
# (Ubuntu/Debian: libasound2-dev · Fedora: alsa-lib-devel).
audio = ["dep:rodio"]
# Host real desktop applications inside texttop windows (Windows only):
# window pixels are mirrored into cells, input is forwarded back.
apphost = ["dep:windows", "dep:windows-core"]
# Embedded browser/video engine.
# Windows: WebView2 · Linux: WebKitGTK · macOS: WKWebView (webkit crate).
web-engine = [
    "dep:webview2-com",
    "dep:windows",
    "dep:windows-core",
    "dep:gtk",
    "dep:webkit2gtk",
    "dep:javascriptcore-rs",
    "dep:webkit",
]

[dependencies]
ratatui = "0.29"
anyhow = "1"
chrono = "0.4"
dirs = "5"
image = "0.25"
url = "2"
serde_json = "1"
unicode-width = "0.2"
portable-pty = "0.8"
vt100 = "0.15"
rodio = { version = "0.19", optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = { version = "0.61", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", optional = true, features = ["v2_38"] }
javascriptcore-rs = { version = "1.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Off-screen WKWebView (requires Xcode CLT / macOS 13+).
webkit = { version = "0.3", optional = true }

[profile.release]
lto = true
opt-level = 3

# The renderer samples millions of pixels per frame; unoptimized debug builds
# are unusably slow. Light optimization keeps dev builds interactive.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

# The macOS engine needs API that published webkit-0.3.11 does not have
# (WebView::set_frame_size, WebView::take_snapshot_rgba) and a fix for a crash
# on loadHTMLString navigations, plus stubs for call sites that reference
# macOS 15.2/26 symbols missing from the Xcode 15 SDK. The patched crate is
# vendored so a fresh clone builds; see vendor/webkit/PATCHES.md.
[patch.crates-io]
webkit = { path = "vendor/webkit" }
